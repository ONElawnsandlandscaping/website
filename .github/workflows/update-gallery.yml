
name: Update Photo Gallery

on:
  push:
    paths:
      - "gallery/**"
      - ".github/workflows/update-gallery.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-gallery:
    runs-on: ubuntu-latest

    steps:
      - name: Get website files
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Build photo list
        shell: bash
        run: |
          python3 <<'PY'
          import json
          from pathlib import Path

          folder = Path("gallery")
          folder.mkdir(parents=True, exist_ok=True)

          extensions = {
              ".jpg", ".jpeg", ".png",
              ".webp", ".gif", ".avif"
          }

          photos = []

          for path in sorted(
              folder.iterdir(),
              key=lambda item: item.name.lower()
          ):
              if not path.is_file():
                  continue

              if path.suffix.lower() not in extensions:
                  continue

              photos.append({
                  "src": "gallery/" + path.name
              })

          output = folder / "photos.json"
          output.write_text(
              json.dumps(photos, indent=2) + "\n",
              encoding="utf-8"
          )

          print(f"Found {len(photos)} photos.")
          PY

      - name: Save updated photo list
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gallery/photos.json

          if git diff --cached --quiet; then
            echo "Photo list is already up to date."
          else
            git commit -m "Automatically update photo gallery"
            git push
          fi
