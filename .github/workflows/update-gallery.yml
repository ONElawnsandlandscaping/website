
name: Update Photo Gallery

on:
  push:
    paths:
      - "gallery/**"
      - ".github/workflows/update-gallery.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-gallery:
    runs-on: ubuntu-latest

    steps:
      - name: Get website files
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Build photo and video list
        shell: bash
        run: |
          python3 <<'PY'
          import json
          from pathlib import Path

          folder = Path("gallery")
          folder.mkdir(parents=True, exist_ok=True)

          image_extensions = {
              ".jpg", ".jpeg", ".png",
              ".webp", ".gif", ".avif"
          }

          video_extensions = {".mp4"}
          media = []

          for path in sorted(
              folder.iterdir(),
              key=lambda item: item.name.lower()
          ):
              if not path.is_file():
                  continue

              extension = path.suffix.lower()

              if extension in image_extensions:
                  media.append({
                      "src": "gallery/" + path.name,
                      "type": "image"
                  })
              elif extension in video_extensions:
                  media.append({
                      "src": "gallery/" + path.name,
                      "type": "video"
                  })

          output = folder / "photos.json"
          output.write_text(
              json.dumps(media, indent=2) + "\n",
              encoding="utf-8"
          )

          print(f"Found {len(media)} photos and videos.")
          PY

      - name: Save updated media list
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gallery/photos.json

          if git diff --cached --quiet; then
            echo "Gallery list is already up to date."
          else
            git commit -m "Automatically update photo gallery"
            git push
          fi
