<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gallery | ONE Lawns & Landscaping</title>

    <meta name="description" content="View lawn care and landscaping projects by ONE Lawns & Landscaping in Yukon, Mustang, El Reno, and Oklahoma City, Oklahoma.">

    <meta name="theme-color" content="#2f8c2f">

    <link rel="stylesheet" href="style.css">

    <style>
        .gallery-page {
            max-width: 1400px;
            margin: 0 auto;
            padding: 35px 20px 60px;
        }

        .gallery-heading {
            text-align: center;
            margin-bottom: 30px;
        }

        .gallery-heading h1 {
            color: #1f6b2a;
            font-size: 36px;
            margin-bottom: 8px;
        }

        .gallery-heading p {
            color: #555;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 20px;
        }

        .gallery-item {
            overflow: hidden;
            border-radius: 8px;
            background: #fff;
            border: 1px solid #ddd;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.06);
        }

        .gallery-item img {
            display: block;
            width: 100%;
            height: 260px;
            object-fit: cover;
            cursor: pointer;
            transition: transform 0.25s ease;
        }

        .gallery-item img:hover {
            transform: scale(1.03);
        }

        .gallery-caption {
            padding: 12px 15px;
            font-weight: bold;
            color: #1f6b2a;
        }

        .gallery-empty {
            text-align: center;
            padding: 35px 20px;
            color: #555;
        }

        .gallery-back {
            display: block;
            width: fit-content;
            margin: 35px auto 0;
            padding: 12px 22px;
            border-radius: 6px;
            background: #2f8c2f;
            color: #fff;
            text-decoration: none;
            font-weight: bold;
        }

        .gallery-back:hover {
            background: #1f6b2a;
        }

        /* Enlarged photo viewer */

        .photo-viewer {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 1000;
            padding: 25px;
            background: rgba(0, 0, 0, 0.92);
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        .photo-viewer.open {
            display: flex;
        }

        .photo-viewer img {
            max-width: 95%;
            max-height: 82vh;
            object-fit: contain;
        }

        .photo-viewer button {
            border: 0;
            cursor: pointer;
            color: #fff;
            background: #2f8c2f;
            padding: 10px 16px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
        }

        .viewer-close {
            position: absolute;
            top: 18px;
            right: 20px;
        }

        .viewer-caption {
            color: #fff;
            margin-top: 12px;
            text-align: center;
        }

        @media (max-width: 900px) {
            .gallery-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            .gallery-item img {
                height: 230px;
            }
        }

        @media (max-width: 600px) {
            .gallery-page {
                padding: 25px 15px 40px;
            }

            .gallery-heading h1 {
                font-size: 29px;
            }

            .gallery-grid {
                grid-template-columns: 1fr;
                gap: 18px;
            }

            .gallery-item img {
                height: auto;
                max-height: 400px;
                object-fit: cover;
            }
        }
    </style>
</head>

<body>

    <!-- HEADER -->

    <header class="site-header">

        <a href="index.html" class="header-logo-link">
            <img
                src="logo.png"
                alt="ONE Lawns & Landscaping"
                class="logo"
            >
        </a>

        <a href="terms.html" class="terms-link">
            Click for Terms of Service
        </a>

    </header>


    <!-- GALLERY -->

    <main class="gallery-page">

        <div class="gallery-heading">

            <h1>OUR GALLERY</h1>

            <p>
                Take a look at our lawn care and landscaping work.
            </p>

        </div>


        <!--
        ADD NEW PHOTOS HERE.

        1. Upload the photo into the gallery folder in GitHub.
        2. Copy one gallery-item block below.
        3. Change the image filename and caption.
        4. Commit your changes.

        Example image path: gallery/lawn-mowing-01.jpg
        -->

        <div class="gallery-grid" id="gallery-grid">


            <!-- EXAMPLE PHOTO 1 -->

            <div class="gallery-item">

                <img
                    src="gallery/lawn-mowing-01.jpg"
                    alt="Lawn mowing project"
                    data-caption="Lawn Care"
                    loading="lazy"
                >

                <div class="gallery-caption">
                    Lawn Care
                </div>

            </div>


            <!-- EXAMPLE PHOTO 2 -->

            <div class="gallery-item">

                <img
                    src="gallery/landscaping-01.jpg"
                    alt="Landscaping project"
                    data-caption="Landscaping"
                    loading="lazy"
                >

                <div class="gallery-caption">
                    Landscaping
                </div>

            </div>


        </div>


        <a href="index.html" class="gallery-back">
            &larr; Back to Home
        </a>

    </main>


    <!-- PHOTO VIEWER -->

    <div
        class="photo-viewer"
        id="photo-viewer"
        role="dialog"
        aria-modal="true"
        aria-label="Enlarged gallery photo"
        aria-hidden="true"
    >

        <button
            type="button"
            class="viewer-close"
            id="viewer-close"
            aria-label="Close photo"
        >
            Close &times;
        </button>

        <img id="viewer-image" src="" alt="">

        <p class="viewer-caption" id="viewer-caption"></p>

    </div>


    <!-- PHOTO VIEWER SCRIPT -->

    <script>
        const viewer = document.getElementById("photo-viewer");
        const viewerImage = document.getElementById("viewer-image");
        const viewerCaption = document.getElementById("viewer-caption");
        const closeButton = document.getElementById("viewer-close");

        document.querySelectorAll(".gallery-item img").forEach(function (photo) {
            photo.addEventListener("click", function () {
                viewerImage.src = photo.src;
                viewerImage.alt = photo.alt;
                viewerCaption.textContent =
                    photo.dataset.caption || photo.alt;

                viewer.classList.add("open");
                viewer.setAttribute("aria-hidden", "false");
                closeButton.focus();
            });
        });

        function closeViewer() {
            viewer.classList.remove("open");
            viewer.setAttribute("aria-hidden", "true");
            viewerImage.src = "";
        }

        closeButton.addEventListener("click", closeViewer);

        viewer.addEventListener("click", function (event) {
            if (event.target === viewer) {
                closeViewer();
            }
        });

        document.addEventListener("keydown", function (event) {
            if (event.key === "Escape") {
                closeViewer();
            }
        });
    </script>

</body>
</html>
