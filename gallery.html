
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gallery | ONE Lawns &amp; Landscaping</title>

    <meta name="description" content="View lawn care and landscaping projects by ONE Lawns &amp; Landscaping in Yukon, Mustang, El Reno, and Oklahoma City, Oklahoma.">

    <meta name="theme-color" content="#2f8c2f">

    <link rel="stylesheet" href="style.css">

    <style>
        .gallery-page {
            max-width: 1400px;
            width: 100%;
            margin: 0 auto;
            padding: 35px 20px 60px;
        }

        .gallery-heading {
            text-align: center;
            margin-bottom: 30px;
        }

        .gallery-heading h1 {
            color: #1f6b2a;
            font-size: 36px;
            margin-bottom: 8px;
        }

        .gallery-heading p {
            color: #555;
        }

        .gallery-status {
            text-align: center;
            padding: 25px 15px;
            color: #555;
        }

        .gallery-status.error {
            color: #a32626;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 20px;
        }

        .gallery-item {
            overflow: hidden;
            border-radius: 8px;
            background: #fff;
            border: 1px solid #ddd;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.06);
        }

        .gallery-item button {
            display: block;
            width: 100%;
            padding: 0;
            border: 0;
            background: transparent;
            cursor: pointer;
        }

        .gallery-item img {
            display: block;
            width: 100%;
            height: 260px;
            object-fit: cover;
            transition: transform 0.25s ease;
        }

        .gallery-item button:hover img {
            transform: scale(1.03);
        }

        .gallery-item button:focus-visible {
            outline: 3px solid #2f8c2f;
            outline-offset: -3px;
        }

        .gallery-back {
            display: block;
            width: fit-content;
            margin: 35px auto 0;
            padding: 12px 22px;
            border-radius: 6px;
            background: #2f8c2f;
            color: #fff;
            text-decoration: none;
            font-weight: bold;
        }

        .gallery-back:hover {
            background: #1f6b2a;
        }

        /* Enlarged photo viewer */

        .photo-viewer {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 1000;
            padding: 60px 20px 25px;
            background: rgba(0, 0, 0, 0.92);
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        .photo-viewer.open {
            display: flex;
        }

        .photo-viewer img {
            max-width: 95%;
            max-height: 82vh;
            object-fit: contain;
        }

        .photo-viewer button {
            border: 0;
            cursor: pointer;
            color: #fff;
            background: #2f8c2f;
            padding: 10px 16px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
        }

        .viewer-close {
            position: absolute;
            top: 18px;
            right: 20px;
        }

        body.viewer-open {
            overflow: hidden;
        }

        @media (max-width: 900px) {
            .gallery-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            .gallery-item img {
                height: 230px;
            }
        }

        @media (max-width: 600px) {
            .gallery-page {
                padding: 25px 15px 40px;
            }

            .gallery-heading h1 {
                font-size: 29px;
            }

            .gallery-grid {
                grid-template-columns: 1fr;
                gap: 18px;
            }

            .gallery-item img {
                height: auto;
                aspect-ratio: 4 / 3;
                object-fit: cover;
            }

            .photo-viewer {
                padding-left: 12px;
                padding-right: 12px;
            }

            .photo-viewer img {
                max-width: 100%;
                max-height: 75vh;
            }
        }
    </style>
</head>

<body>

    <header class="site-header">
        <a href="index.html" class="header-logo-link">
            <img
                src="logo.png"
                alt="ONE Lawns &amp; Landscaping"
                class="logo"
            >
        </a>

        <a href="terms.html" class="terms-link">
            Click for Terms of Service
        </a>
    </header>

    <main class="gallery-page">

        <div class="gallery-heading">
            <h1>OUR GALLERY</h1>
            <p>
                Take a look at our lawn care and landscaping work.
            </p>
        </div>

        <p
            class="gallery-status"
            id="gallery-status"
            role="status"
            aria-live="polite"
        >
            Loading photos...
        </p>

        <div class="gallery-grid" id="gallery-grid"></div>

        <a href="index.html" class="gallery-back">
            &larr; Back to Home
        </a>

    </main>

    <div
        class="photo-viewer"
        id="photo-viewer"
        role="dialog"
        aria-modal="true"
        aria-label="Enlarged gallery photo"
        aria-hidden="true"
    >
        <button
            type="button"
            class="viewer-close"
            id="viewer-close"
            aria-label="Close photo"
        >
            Close &times;
        </button>

        <img id="viewer-image" src="" alt="">
    </div>

    <script>
        const galleryGrid = document.getElementById("gallery-grid");
        const galleryStatus = document.getElementById("gallery-status");

        const viewer = document.getElementById("photo-viewer");
        const viewerImage = document.getElementById("viewer-image");
        const closeButton = document.getElementById("viewer-close");

        let previousFocus = null;

        function openViewer(photo) {
            previousFocus = document.activeElement;

            viewerImage.src = photo.src;
            viewerImage.alt = photo.alt;

            viewer.classList.add("open");
            viewer.setAttribute("aria-hidden", "false");
            document.body.classList.add("viewer-open");

            closeButton.focus();
        }

        function closeViewer() {
            viewer.classList.remove("open");
            viewer.setAttribute("aria-hidden", "true");
            document.body.classList.remove("viewer-open");

            viewerImage.src = "";
            viewerImage.alt = "";

            if (previousFocus && previousFocus.focus) {
                previousFocus.focus();
            }
        }

        function showError() {
            galleryStatus.classList.add("error");
            galleryStatus.textContent =
                "Photos could not be loaded. Please refresh the page or try again later.";
        }

        async function loadGallery() {
            try {
                const response = await fetch("gallery/photos.json", {
                    cache: "no-store"
                });

                if (!response.ok) {
                    throw new Error("Photo list not found.");
                }

                const photos = await response.json();

                if (!Array.isArray(photos)) {
                    throw new Error("Invalid photo list.");
                }

                const validPhotos = photos.filter(function (photo) {
                    return photo &&
                        typeof photo.src === "string" &&
                        /\.(jpe?g|png|webp|gif|avif)$/i.test(photo.src);
                });

                if (validPhotos.length === 0) {
                    galleryStatus.textContent =
                        "Our project photos will be added here soon.";
                    return;
                }

                const fragment = document.createDocumentFragment();
                let failedPhotos = 0;

                validPhotos.forEach(function (photo) {
                    const card = document.createElement("div");
                    card.className = "gallery-item";

                    const button = document.createElement("button");
                    button.type = "button";
                    button.setAttribute("aria-label", "Enlarge photo");

                    const image = document.createElement("img");
                    image.src = photo.src;
                    image.alt = "Lawn care and landscaping project";
                    image.loading = "lazy";
                    image.decoding = "async";

                    image.addEventListener("error", function () {
                        card.remove();
                        failedPhotos++;

                        if (galleryGrid.children.length === 0) {
                            showError();
                        } else {
                            galleryStatus.textContent =
                                galleryGrid.children.length +
                                " photos in our gallery.";
                        }
                    }, { once: true });

                    button.addEventListener("click", function () {
                        openViewer(image);
                    });

                    button.appendChild(image);
                    card.appendChild(button);
                    fragment.appendChild(card);
                });

                galleryGrid.replaceChildren(fragment);

                galleryStatus.textContent =
                    validPhotos.length +
                    (validPhotos.length === 1
                        ? " photo in our gallery."
                        : " photos in our gallery.");

            } catch (error) {
                console.error("Gallery loading error:", error);
                showError();
            }
        }

        closeButton.addEventListener("click", closeViewer);

        viewer.addEventListener("click", function (event) {
            if (event.target === viewer) {
                closeViewer();
            }
        });

        document.addEventListener("keydown", function (event) {
            if (
                event.key === "Escape" &&
                viewer.classList.contains("open")
            ) {
                closeViewer();
            }
        });

        loadGallery();
    </script>

</body>
</html>
